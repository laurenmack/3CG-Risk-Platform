<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vendor Scorecard · 3CG</title>
  <link rel="icon" href="assets/3cg-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Open+Sans:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="container">
    <div class="page-intro">
      <p class="eyebrow">Tool 1 · Third-party risk</p>
      <h1>Vendor Scorecard</h1>
      <p class="lede">How much risk each ReadyFare vendor brings to PRT, scored from 1 (lower risk) to 5 (higher risk).</p>
    </div>

    <section>
      <!-- ===== VENDOR SCORECARD: BUILD INSIDE THIS SECTION ===== -->
      <div class="slot">
        <div class="slot-head">
          <span class="slot-owner">Owner: <strong>[Name]</strong> · Vendor Scorecard</span>
          <span class="badge status-progress">In progress</span>
        </div>
        <p class="muted small">Reads the Vendors, Score_Reasons, Weights and Tiers tabs. Build in js/scorecard.js.</p>
        <div id="scorecard-app"></div>
        <div id="scorecard-app-data" class="callout callout-info"></div>
      </div>
      <!-- ===== END VENDOR SCORECARD ===== -->
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/site.js"></script>
  <script src="js/scorecard.js"></script>
</body>
</html>
